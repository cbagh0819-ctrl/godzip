[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "godzip"
version = "1.0.0"
authors = [
  { name="Chandan Bagh", email="baghchandan53@gmail.com" },
]
description = "Next-Generation Intelligent Lossless Compression Platform for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = [
    "zstandard>=0.22.0",
    "brotli>=1.1.0",
    "lz4>=4.3.0",
    "py7zr>=0.20.0",
    "blake3>=0.4.0",
    "PySide6>=6.6.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
]

[project.urls]
"Homepage" = "https://github.com/cbagh0819-ctrl/GODZIP"
"Bug Tracker" = "https://github.com/cbagh0819-ctrl/GODZIP/issues"

[project.scripts]
godzip = "godzip.cli:main"
